<title>PromptStrava</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  color-scheme: dark;
  --bg:#0C0E13; --card:#151922; --elev:#1E2430; --stroke:rgba(255,255,255,.07);
  --t1:#F2F4F8; --t2:#8B94A6; --t3:#5A6274;
  --flame:#FC5200; --flame-soft:#FF7A3D; --ember:#FF3B6B;
  --clarity:#38BDF8; --func:#4ADE80; --eff:#FBBF24; --bad:#F87171;
  --grad:linear-gradient(135deg,var(--flame),var(--ember));
  --round:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--t1); font-family:var(--round);
  min-height:100vh; overflow:hidden;
}
button{font-family:var(--round);border:0;background:none;color:inherit;cursor:pointer;padding:0}
input,textarea{font-family:var(--round);color:var(--t1)}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px;border-radius:6px}

/* ---------- shell: phone column + desktop rail ---------- */
#stage{position:fixed;inset:0;display:flex;justify-content:center}
#stage::before{ /* ambient flame glow, visible on wide screens */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(520px 320px at 50% -80px, rgba(252,82,0,.14), transparent 70%);
}
#rail{
  display:none; width:200px; flex-direction:column; gap:6px;
  padding:26px 14px calc(18px + env(safe-area-inset-bottom));
  border-right:1px solid var(--stroke); position:relative;
}
#rail .logo{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;font-weight:900;font-size:19px}
#rail .logo .fl{font-size:24px;filter:drop-shadow(0 0 12px rgba(252,82,0,.55))}
.railbtn{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;
  font-weight:800;font-size:14px;color:var(--t2);width:100%;text-align:left;
}
.railbtn:hover{background:var(--card)}
.railbtn.on{color:var(--flame);background:rgba(252,82,0,.12)}
.railbtn .ic{width:19px;height:19px}
.railfoot{margin-top:auto;padding:10px;font-size:11.5px;font-weight:600;color:var(--t3);line-height:1.5}
#shell{
  position:relative;width:100%;max-width:560px;height:100%;
  display:flex;flex-direction:column;background:var(--bg);
}
@media(min-width:900px){
  #rail{display:flex}
  #shell{border-left:1px solid var(--stroke);border-right:1px solid var(--stroke)}
  #tabbar{display:none!important}
}

#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px;scrollbar-width:none}
#main::-webkit-scrollbar{display:none}
.pagepad{padding-bottom:110px}

/* ---------- tab bar ---------- */
#tabbar{
  display:flex;align-items:stretch;justify-content:space-around;
  border-top:1px solid var(--stroke);background:rgba(12,14,19,.92);backdrop-filter:blur(14px);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;color:var(--t3);font-size:10px;font-weight:800;padding:2px 0;min-height:44px}
.tab .ic{width:23px;height:23px}
.tab.on{color:var(--flame)}
.tab-plus{
  width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;margin-top:-14px;
  box-shadow:0 6px 18px rgba(252,82,0,.45);
}
.tab-plus .ic{width:22px;height:22px}

/* ---------- shared components ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 0 4px}
.hdr h1{margin:0;font-size:26px;font-weight:900}
.hdr .sub{font-size:13px;font-weight:700;color:var(--t2);margin-top:2px}
.streak{
  display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--stroke);
  border-radius:999px;padding:7px 13px;font-weight:900;font-size:15px;
}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:16px}
.secthead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.secthead h2{margin:0;font-size:20px;font-weight:900}
.secthead .acc{font-size:13px;font-weight:700;color:var(--flame)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  font-size:11px;font-weight:800;line-height:1;white-space:nowrap;
}
.filterchip{
  padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800;
  background:var(--card);border:1px solid var(--stroke);color:var(--t2);white-space:nowrap;
}
.filterchip.on{color:var(--flame);background:rgba(252,82,0,.15);border-color:var(--flame)}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px;margin:0 -2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pillrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.pillrow::-webkit-scrollbar{display:none}
.btn-primary{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px;border-radius:15px;background:var(--grad);color:#fff;
  font-size:17px;font-weight:900;
}
.btn-primary:disabled{background:var(--elev);color:var(--t3);cursor:default}
.btn-secondary{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px;border-radius:15px;background:var(--elev);color:var(--t1);
  font-size:16px;font-weight:900;
}
.ic{width:16px;height:16px;flex:none}
.avatar{
  display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  background:var(--elev);border:1px solid var(--stroke);flex:none;
}

/* prompt card */
.pcard{cursor:pointer;transition:transform .15s ease, border-color .15s ease;text-align:left;width:100%;display:block}
.pcard:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.16)}
.pcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pcard h3{margin:7px 0 0;font-size:17px;font-weight:800;line-height:1.25}
.pcard .snippet{
  font-family:var(--mono);font-size:12.5px;color:var(--t2);margin:12px 0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;
}
.pcard .foot{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;color:var(--t3)}
.pcard .foot .grow{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.pcard .foot .handle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statpill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.feedlist{display:flex;flex-direction:column;gap:12px}

/* trending card */
.tcard{
  flex:none;width:230px;height:132px;background:var(--card);border:1px solid var(--stroke);
  border-radius:18px;padding:14px;display:flex;flex-direction:column;text-align:left;cursor:pointer;
  transition:transform .15s ease;
}
.tcard:hover{transform:translateY(-2px)}
.tcard h3{margin:9px 0 0;font-size:14.5px;font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--t3)}

/* challenge banner */
.challenge{
  width:100%;text-align:left;border-radius:20px;padding:18px;color:#fff;background:var(--grad);
  display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:transform .15s ease;
  box-shadow:0 8px 28px rgba(252,82,0,.25);
}
.challenge:hover{transform:translateY(-1px)}
.challenge .eyebrow{display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:.09em;opacity:.88}
.challenge .theme{font-size:22px;font-weight:900}
.challenge .cta{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;opacity:.9}
.challenge .cta .ic{margin-left:auto;width:19px;height:19px}

/* rings */
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.ringbox{position:relative}
.ringbox svg{display:block}
.ring-fg{transition:stroke-dashoffset 1.1s cubic-bezier(.25,.8,.3,1)}
.ringnum{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-variant-numeric:tabular-nums;
}
.ringlabel{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--t2);text-transform:uppercase}
.badge-ring{position:relative;flex:none}
.badge-ring .ringnum{font-size:15px}

/* axis bars */
.axis{display:flex;flex-direction:column;gap:4px}
.axis .lab{display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--t2)}
.axis .lab b{font-size:13px}
.axis .track{height:6px;border-radius:999px;overflow:hidden}
.axis .fill{height:100%;border-radius:999px;transition:width .9s cubic-bezier(.25,.8,.3,1)}

.rationale{display:flex;gap:10px;align-items:flex-start}
.rationale .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.rationale .rt{font-size:10px;font-weight:900;letter-spacing:.1em}
.rationale p{margin:3px 0 0;font-size:14px;font-weight:500;line-height:1.45}

/* detail */
.backbtn{display:inline-flex;align-items:center;gap:6px;color:var(--t2);font-weight:800;font-size:14px;padding:14px 0 4px}
.backbtn .ic{width:15px;height:15px}
.dtitle{margin:8px 0 10px;font-size:26px;font-weight:900;line-height:1.15;text-wrap:balance}
.dmeta{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--t2)}
.lineage{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-top:14px;
  padding:12px;border-radius:12px;background:rgba(56,189,248,.1);color:var(--clarity);
  font-size:12px;font-weight:700;
}
.promptbody{font-family:var(--mono);font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;user-select:text;margin:0}
.copybtn{display:inline-flex;align-items:center;gap:5px;color:var(--flame);font-weight:800;font-size:12px}
.copybtn.ok{color:var(--func)}
.modelchip{background:var(--elev);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;color:var(--t2)}
.actionbar{display:flex;gap:10px;margin-top:20px}
.actionbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;
  background:var(--card);border:1px solid var(--stroke);border-radius:14px;
  font-size:11px;font-weight:800;color:var(--t2);
}
.actionbtn .ic{width:18px;height:18px}

/* explore */
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:8px}
.cattile{
  border:1px solid;border-radius:20px;padding:16px;height:148px;display:flex;flex-direction:column;
  align-items:flex-start;text-align:left;cursor:pointer;transition:transform .15s ease;
}
.cattile:hover{transform:translateY(-2px)}
.cattile .em{font-size:26px}
.cattile h3{margin:auto 0 2px;font-size:16px;font-weight:900}
.cattile .n{font-size:12px;font-weight:700;color:var(--t2)}
.searchbox{
  display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--stroke);
  border-radius:13px;padding:11px 13px;margin-top:14px;
}
.searchbox input{flex:1;background:none;border:0;font-size:15px;font-weight:600;outline:none}
.searchbox .ic{color:var(--t3)}

/* leaderboard */
.seg{display:flex;background:var(--card);border:1px solid var(--stroke);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:13px;font-weight:800;color:var(--t2)}
.seg button.on{background:var(--elev);color:var(--t1)}
.lbrow{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;
  background:var(--card);border:1px solid var(--stroke);
}
.lbrow.me{background:rgba(252,82,0,.12);border-color:rgba(252,82,0,.6)}
.lbrow .rk{width:34px;text-align:center;font-weight:900;font-size:15px;color:var(--t2);font-variant-numeric:tabular-nums}
.lbrow .who{flex:1;min-width:0}
.lbrow .who b{display:block;font-size:15px}
.lbrow .who span{font-size:12px;color:var(--t3);font-weight:600}
.lbrow .delta{display:flex;align-items:center;gap:2px;font-size:11px;font-weight:900}
.lbrow .best{width:44px;text-align:right;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.myrank{
  position:sticky;bottom:14px;display:flex;align-items:center;gap:8px;margin-top:14px;
  background:var(--grad);border-radius:999px;padding:13px 18px;color:#fff;
  box-shadow:0 8px 24px rgba(252,82,0,.4);
}
.myrank b{font-size:20px;font-weight:900}
.myrank span{font-size:13px;font-weight:700;opacity:.85}

/* profile */
.profhead{display:flex;align-items:center;gap:16px;padding-top:18px}
.statrow{display:flex;gap:10px;margin-top:20px}
.statcard{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 4px;
  background:var(--card);border:1px solid var(--stroke);border-radius:16px;
}
.statcard b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.statcard span{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--t2);text-transform:uppercase}
.weekbars{display:flex;gap:10px;align-items:flex-end;height:76px;margin-top:14px}
.weekbars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.weekbars .bar{width:100%;border-radius:999px;background:var(--elev);min-height:8px}
.weekbars .bar.hot{background:var(--grad)}
.weekbars .dl{font-size:10px;font-weight:800;color:var(--t3)}
.badgecard{
  flex:none;width:108px;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:16px 6px;border-radius:16px;border:1px solid;
}
.badgecard .em{font-size:24px}
.badgecard span{font-size:11px;font-weight:800;color:var(--t2);white-space:nowrap}
.emptystate{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 16px;text-align:center}
.emptystate .em{font-size:30px;opacity:.5}
.emptystate p{margin:0;font-size:13px;font-weight:600;color:var(--t2);max-width:34ch}
.emptycta{padding:11px 18px;border-radius:999px;background:var(--grad);color:#fff;font-size:14px;font-weight:900}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;justify-content:center}
.overlay .inner{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;overflow-y:auto;padding:0 16px;scrollbar-width:none}
.overlay .inner::-webkit-scrollbar{display:none}
.ovnav{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px;position:sticky;top:0;background:var(--bg);z-index:2}
.ovnav h2{margin:0;font-size:17px;font-weight:900;position:absolute;left:50%;transform:translateX(-50%)}
.ovnav button{color:var(--t2);font-weight:700;font-size:15px;min-height:44px}

/* submit flow */
.field{width:100%;background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:14px;font-size:18px;font-weight:800;outline:none}
.field::placeholder{color:var(--t3);font-weight:700}
textarea.field{font-family:var(--mono);font-size:14px;font-weight:500;resize:none;flex:1;min-height:200px;line-height:1.6}
.subfoot{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--t2);padding:2px 2px 0}
.notice{display:flex;gap:8px;align-items:flex-start;padding:12px;border-radius:12px;font-size:12px;font-weight:700;line-height:1.4}
.catpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catbtn{
  display:flex;align-items:center;gap:8px;padding:13px 12px;border-radius:13px;text-align:left;
  background:var(--card);border:1px solid var(--stroke);color:var(--t2);font-size:13px;font-weight:800;
}
.subchips{display:flex;flex-wrap:wrap;gap:8px}
.subchip{
  padding:9px 13px;border-radius:999px;background:var(--card);border:1px solid var(--stroke);
  color:var(--t2);font-size:12px;font-weight:800;
}
.judging{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.spin{animation:spin 1.1s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.judging h2{margin:0;font-size:20px;font-weight:900}
.judging p{margin:0;font-size:13px;font-weight:700;color:var(--t2)}
.tier{font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
.achieve{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.apill{
  display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:999px;
  font-size:12px;font-weight:900;border:1px solid;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;
}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.xpline{display:flex;flex-direction:column;align-items:center;gap:3px}
.xpline .xp{color:var(--flame);font-size:14px;font-weight:900}
.xpline .rank{color:var(--t2);font-size:13px;font-weight:700}

/* onboarding */
.onb{flex:1;display:flex;flex-direction:column;padding:0 24px calc(24px + env(safe-area-inset-bottom))}
.onbpage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.onb h1{margin:0;font-size:38px;font-weight:900;text-wrap:balance}
.onb h2{margin:0;font-size:27px;font-weight:900;text-wrap:balance}
.onb .lead{margin:0;font-size:16px;font-weight:600;color:var(--t2);line-height:1.5;max-width:34ch}
.flamehero{font-size:64px;filter:drop-shadow(0 0 34px rgba(252,82,0,.6))}
.dots{display:flex;gap:8px;justify-content:center;padding:18px 0}
.dots span{width:8px;height:8px;border-radius:999px;background:var(--elev);transition:all .3s}
.dots span.on{width:24px;background:var(--flame)}
.intgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.intbtn{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border-radius:16px;
  background:var(--card);border:1px solid var(--stroke);color:var(--t2);font-size:13px;font-weight:800;
}
.intbtn .em{font-size:23px}

/* toast */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:60;
  background:var(--elev);border:1px solid var(--stroke);color:var(--t1);
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:800;
  opacity:0;pointer-events:none;transition:all .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<div id="stage">
  <nav id="rail" aria-label="Primary"></nav>
  <div id="shell">
    <main id="main"></main>
    <nav id="tabbar" aria-label="Primary"></nav>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ============================================================
   PromptStrava — web companion. Same loop, same fire.
   Mirrors the iOS app: Theme.swift palette, AppStore logic,
   heuristic judge, and localStorage persistence.
   ============================================================ */

// ---------- categories ----------
const CATS = {
  work:      {name:"Work",             em:"💼", color:"#3B82F6", subs:["Resume Builder","Interview Prep","Email & Slack Drafting","Meeting Summarizer","Code Review","Presentation Builder"]},
  social:    {name:"Social",           em:"👥", color:"#EC4899", subs:["Dating Profile Writer","Conflict Mediator","Gift Ideas","Toasts & Speeches","Small Talk Coach"]},
  health:    {name:"Health & Fitness", em:"🏃", color:"#22C55E", subs:["Diet Planner","Workout Coach","Sleep Optimizer","Habit Builder","Mental Reset"]},
  finance:   {name:"Personal Finance", em:"📈", color:"#14B8A6", subs:["Budgeter","Investment Research","Expense Categorizer","Negotiation Scripts","Tax Prep Helper"]},
  learning:  {name:"Learning & Skills",em:"🎓", color:"#8B5CF6", subs:["Language Tutor","Concept Explainer","Study Planner","Flashcard Generator","Book Distiller"]},
  creativity:{name:"Creativity",       em:"🎨", color:"#F97316", subs:["Story Starter","Songwriting Partner","Naming & Branding","Image Prompting","World Builder"]},
  lifeAdmin: {name:"Life Admin",       em:"✅", color:"#6366F1", subs:["Travel Planner","Meal Prep","Email Triage","Moving Checklist","Appointment Scripts"]},
};
const CAT_KEYS = Object.keys(CATS);
const CHALLENGE = {theme:"Best budgeting prompt", cat:"finance", endsIn:3};

// ---------- icons ----------

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const hoursAgo = h => new Date(Date.now() - h*3600e3).toISOString();
const dayKey = d => { const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const hashStr = s => { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return h & 0x7FFFFFFF; };
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const composite = sc => Math.round(sc.c.v*0.35 + sc.f.v*0.40 + sc.e.v*0.25);
const tierName = n => n<40?"Rough Draft": n<60?"Solid": n<75?"Sharp": n<90?"Elite":"Legendary";
const compColor = n => n<40?"var(--bad)": n<60?"var(--eff)": n<80?"var(--flame-soft)":"var(--func)";
const tokensOf = t => Math.max(1, Math.round(t.length/4));
const levelOf = xp => Math.max(1, Math.floor(Math.sqrt(xp)/10)+1);
const xpFloor = lv => { const l=(lv-1)*10; return l*l; };
function timeAgo(iso){
  const m = Math.max(1, Math.round((Date.now()-new Date(iso))/60000));
  if(m<60) return m+"m ago";
  const h = Math.round(m/60); if(h<24) return h+"h ago";
  return Math.round(h/24)+"d ago";
}

// ---------- store + persistence ----------
const LS_KEY = "promptstrava-web-v1";
let store = null;

function computeStreak(daySet){
  let d = new Date(); d.setHours(0,0,0,0);
  if(!daySet.has(dayKey(d))) d.setDate(d.getDate()-1);
  let n = 0;
  while(daySet.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function loadStore(){
  const seedU = seedUsers();
  let prompts = seedPrompts();
  let me = seedU.me;
  let days = new Set([1,2,3,4].map(n=>{ const d=new Date(); d.setDate(d.getDate()-n); return dayKey(d); }));
  let liked=new Set(), used=new Set(), saved=new Set(), interests=new Set();
  let onboarded = false;

  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e){}
  if(raw){
    onboarded = !!raw.onboarded;
    me = raw.user || me;
    days = new Set(raw.days||[]);
    liked = new Set(raw.liked||[]); used = new Set(raw.used||[]); saved = new Set(raw.saved||[]);
    interests = new Set(raw.interests||[]);
    const mine = raw.myPrompts||[];
    const mineIDs = new Set(mine.map(p=>p.id));
    prompts = mine.concat(prompts.filter(p=>!mineIDs.has(p.id)));
    // re-apply my engagement to freshly seeded community prompts
    for(const id of liked) if(!mineIDs.has(id)){ const p=prompts.find(x=>x.id===id); if(p) p.likes++; }
    for(const id of used)  if(!mineIDs.has(id)){ const p=prompts.find(x=>x.id===id); if(p) p.used++; }
    for(const p of mine) if(p.forkedFrom && !mineIDs.has(p.forkedFrom)){ const o=prompts.find(x=>x.id===p.forkedFrom); if(o) o.forks++; }
  }
  me.streak = computeStreak(days);
  store = {me, users:seedU.all, prompts, liked, used, saved, interests, days, onboarded};
}

function persist(){
  const myPrompts = store.prompts.filter(p=>p.author===store.me.id);
  localStorage.setItem(LS_KEY, JSON.stringify({
    onboarded: store.onboarded, user: store.me, myPrompts,
    liked:[...store.liked], used:[...store.used], saved:[...store.saved],
    interests:[...store.interests], days:[...store.days],
  }));
}

const userOf = id => id===store.me.id ? store.me : (store.users.find(u=>u.id===id) || store.me);
const promptOf = id => store.prompts.find(p=>p.id===id);
const myPrompts = () => store.prompts.filter(p=>p.author===store.me.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
const savedPrompts = () => store.prompts.filter(p=>store.saved.has(p.id)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
const trending = () => [...store.prompts].sort((a,b)=>(b.used*3+b.likes)-(a.used*3+a.likes)).slice(0,6);
const feed = () => [...store.prompts].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
function personalizedFeed(){
  if(!store.interests.size) return feed();
  const f = feed().filter(p=>store.interests.has(p.cat)||p.author===store.me.id);
  return f.length ? f : feed();
}
const inCategory = (cat,sub) => store.prompts
  .filter(p=>p.cat===cat && (!sub || p.sub===sub))
  .sort((a,b)=>(b.score?composite(b.score):0)-(a.score?composite(a.score):0));
function searchPrompts(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  return store.prompts.filter(p=>
    p.title.toLowerCase().includes(q) || p.text.toLowerCase().includes(q) ||
    p.sub.toLowerCase().includes(q) || CATS[p.cat].name.toLowerCase().includes(q) ||
    userOf(p.author).handle.toLowerCase().includes(q)
  ).sort((a,b)=>(b.score?composite(b.score):0)-(a.score?composite(a.score):0));
}

// ---------- leaderboard ----------
function leaderboard(cat, tf){
  const cutoff = tf==="week" ? Date.now()-7*864e5 : tf==="month" ? Date.now()-30*864e5 : 0;
  const best = {};
  for(const p of store.prompts){
    if(cat && p.cat!==cat) continue;
    if(cutoff && new Date(p.createdAt) < cutoff) continue;
    if(!p.score) continue;
    const c = composite(p.score);
    const e = best[p.author] || {score:0,count:0};
    best[p.author] = {score:Math.max(e.score,c), count:e.count+1};
  }
  return Object.entries(best)
    .sort((a,b)=> b[1].score!==a[1].score ? b[1].score-a[1].score : b[1].count-a[1].count)
    .map(([uid,v],i)=>({rank:i+1, user:userOf(uid), best:v.score, count:v.count, delta:(hashStr(uid)%5)-2}));
}
const myRank = (cat,tf) => (leaderboard(cat,tf).find(e=>e.user.id===store.me.id)||{}).rank || null;

// ---------- heuristic judge (port of HeuristicJudge) ----------
function judgeScore(text){
  const t = text.trim(), lower = t.toLowerCase();
  const words = lower.split(/\s+/).filter(Boolean), wc = words.length;
  const has = a => a.some(s=>lower.includes(s));
  const hasRole = has(["you are","act as","your role"]);
  const hasFormat = has(["format","bullet","table","json","markdown","numbered","sections","output"]);
  const hasConstraints = has(["must","only","never","always","limit","no more than","at most","avoid","don't"]);
  const hasStructure = t.includes("\n") && (t.includes("1.")||t.includes("- ")||t.includes("#")||t.includes(":")||t.includes("<"));
  const hasSlot = t.includes("[")||t.includes("{")||lower.includes("i will provide")||lower.includes("i'll paste");
  const hasExamples = has(["for example","e.g.","example:","such as"]);
  const hasAudience = has(["for a","aimed at","audience","my "]);
  const asksFirst = has(["ask me","clarifying question","before you start"]);
  const filler = ["please","kindly","if you don't mind","i was wondering"].filter(s=>lower.includes(s)).length;
  const hedging = ["maybe","perhaps","kind of","sort of","somewhat","i guess"].filter(s=>lower.includes(s)).length;
  const uniq = wc ? new Set(words).size/wc : 0;

  let c = 42; if(hasRole)c+=10; if(hasStructure)c+=12; if(hasFormat)c+=10; if(hasAudience)c+=5;
  c -= hedging*5; if(wc<8)c-=12; if(wc>350)c-=8;
  let f = 40; if(hasFormat)f+=12; if(hasConstraints)f+=10; if(hasSlot)f+=8; if(hasExamples)f+=8;
  if(asksFirst)f+=6; if(hasRole)f+=4; if(wc<8)f-=14;
  let e = 55; e += wc<8?6 : wc<60?18 : wc<150?10 : wc<300?-2 : -14;
  e += (uniq-0.6)*40; e -= filler*4 + hedging*3;

  const jitter = (hashStr(t)%7)-3;
  const clamp = v => Math.round(Math.min(98, Math.max(15, v+jitter)));
  return {
    c:{v:clamp(c), r: hasStructure ? "Clear structure helps — tighten any ambiguous verbs to lock in interpretation."
                                   : "Add structure (numbered steps or sections) so the model can't misread intent."},
    f:{v:clamp(f), r: hasFormat ? (hasConstraints ? "Format and constraints are specified — solid, repeatable output."
                                                  : "Output format is set; add hard constraints to handle edge cases.")
                                : "Specify the exact output format you want — that's the #1 reliability booster."},
    e:{v:clamp(e), r: wc>300 ? "Trim it down — long preambles burn tokens without changing the output."
                    : filler>1 ? "Cut the pleasantries; the model doesn't need them and they cost tokens."
                    : "Good token economy — every line is pulling weight."},
  };
}

// category auto-detect (port of CategoryDetector)
function detectCategory(text){
  const lower = text.toLowerCase();
  const KW = {
    work:["resume","cv","interview","email","slack","meeting","standup","code review","pull request","boss","coworker","presentation","jira"],
    health:["workout","diet","meal plan","calorie","protein","sleep","gym","run","fitness","stretch","habit"],
    finance:["budget","invest","stock","expense","savings","salary","negotiat","tax","portfolio","debt"],
    social:["dating","tinder","hinge","gift","conflict","apolog","toast","wedding speech","friend","text back"],
    learning:["explain","teach","learn","study","flashcard","language","vocab","summarize this book","concept","quiz me"],
    creativity:["story","song","lyric","poem","brand name","logo","midjourney","image prompt","character","world"],
    lifeAdmin:["travel","itinerary","packing","grocery","moving","appointment","errand","declutter","schedule my"],
  };
  let best = ["work",0];
  for(const [cat,terms] of Object.entries(KW)){
    const hits = terms.filter(t=>lower.includes(t)).length;
    if(hits > best[1]) best = [cat,hits];
  }
  const cat = best[1]>0 ? best[0] : "work";
  const conf = best[1]===0 ? 0.3 : Math.min(0.95, 0.55 + best[1]*0.13);
  const sub = CATS[cat].subs.reduce((a,b)=>{
    const scoreOf = n => n.toLowerCase().split(" ").filter(w=>w.length>3&&lower.includes(w)).length;
    return scoreOf(b) > scoreOf(a) ? b : a;
  }, CATS[cat].subs[0]);
  return {cat, sub, conf};
}

// ---------- submit ----------
async function doSubmit(title, text, cat, sub, forkOfId){
  await new Promise(r=>setTimeout(r, REDUCED?200:1400));
  const score = judgeScore(text);
  const comp = composite(score);
  const prevBest = Math.max(-1, ...myPrompts().filter(p=>p.score).map(p=>composite(p.score)));
  const lvBefore = levelOf(store.me.xp);
  const badgesBefore = new Set(store.me.badges.map(b=>b.name));

  const prompt = {
    id:"m"+Date.now(), title, text, author:store.me.id, cat, sub,
    createdAt:new Date().toISOString(), likes:0, used:0, forks:0, comments:0,
    score, forkedFrom:forkOfId||null, models:["Claude","ChatGPT","Gemini"],
  };
  store.prompts.unshift(prompt);
  if(forkOfId){ const o=promptOf(forkOfId); if(o) o.forks++; }

  store.me.xp += comp;
  store.days.add(dayKey(new Date()));
  store.me.streak = computeStreak(store.days);
  const award = (cond,name,em,color)=>{ if(cond && !store.me.badges.some(b=>b.name===name)) store.me.badges.push({name,em,color}); };
  award(comp>=85, "Elite Prompt","👑","#FBBF24");
  award(myPrompts().length>=5, "Prolific","🗂️","#8B5CF6");
  award(score.e.v>=90, "Token Miser","⚡","#38BDF8");
  award(store.me.streak>=7, "Week Warrior","🔥","#FC5200");
  persist();

  return {
    prompt,
    newBadges: store.me.badges.filter(b=>!badgesBefore.has(b.name)),
    didLevelUp: levelOf(store.me.xp) > lvBefore,
    isPersonalBest: comp > prevBest,
    weeklyRank: myRank(cat,"week"),
  };
}

function ringHTML(score,{size=96,lw=9,color="var(--flame)",label=null,animate=false,delay=0}={}){
  const r=(size-lw)/2, circ=(2*Math.PI*r).toFixed(1);
  const off=(circ*(1-score/100)).toFixed(1);
  return `<div class="ringwrap" role="img" aria-label="${esc(label||"Score")}: ${score} out of 100">
    <div class="ringbox" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" opacity=".15" stroke-width="${lw}" fill="none"/>
        <circle class="ring-fg${animate?" pending":""}" cx="${size/2}" cy="${size/2}" r="${r}"
          stroke="${color}" stroke-width="${lw}" stroke-linecap="round" fill="none"
          stroke-dasharray="${circ}" stroke-dashoffset="${animate?circ:off}"
          data-off="${off}" data-delay="${delay}"
          transform="rotate(-90 ${size/2} ${size/2})"/>
      </svg>
      <div class="ringnum" style="font-size:${Math.round(size*0.3)}px"
           ${animate?`data-target="${score}" data-delay="${delay}"`:""}>${animate?0:score}</div>
    </div>
    ${label?`<div class="ringlabel">${esc(label)}</div>`:""}
  </div>`;
}
function activateRings(scope){
  scope.querySelectorAll(".ring-fg.pending").forEach(el=>{
    const go = ()=>{ el.style.strokeDashoffset = el.dataset.off; };
    if(REDUCED){ go(); return; }
    setTimeout(()=>requestAnimationFrame(go), Number(el.dataset.delay)*1000 + 60);
  });
  scope.querySelectorAll(".ringnum[data-target]").forEach(el=>{
    const target = Number(el.dataset.target);
    if(REDUCED){ el.textContent = target; return; }
    setTimeout(()=>{
      const t0 = performance.now(), dur = 950;
      const tick = now=>{
        const k = Math.min(1,(now-t0)/dur);
        el.textContent = Math.round(target * (1-Math.pow(1-k,3)));
        if(k<1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }, Number(el.dataset.delay)*1000 + 60);
  });
}
function badgeRing(score,size=44){
  return `<span class="badge-ring">${ringHTML(score,{size,lw:4,color:compColor(score)})}</span>`;

    <span class="dot" style="background:${color}"></span>
    <div><div class="rt" style="color:${color}">${title}</div><p>${esc(text)}</p></div>
  </div>`;
  return `
  <button class="backbtn" onclick="back()">${IC.back}Back</button>
  <div style="margin-top:6px">${catChip(p.cat,p.sub)}</div>
  <h1 class="dtitle">${esc(p.title)}</h1>
  <div class="dmeta">${avatar(u,26)} @${esc(u.handle)} <span style="color:var(--t3)">·</span> <span style="color:var(--t3)">${timeAgo(p.createdAt)}</span></div>
  ${orig?`<button class="lineage" onclick="openDetail('${orig.id}')">${IC.fork}<span style="flex:1;text-align:left">Forked from “${esc(orig.title)}” by @${esc(userOf(orig.author).handle)}</span>›</button>`:""}

  ${p.score?`<div class="card" style="margin-top:18px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;gap:20px;align-items:center">
      ${ringHTML(comp,{size:110,lw:11,color:compColor(comp),label:tierName(comp)})}
      <div style="flex:1;display:flex;flex-direction:column;gap:10px">
        ${axis("CLARITY",p.score.c.v,"var(--clarity)")}
        ${axis("FUNCTION",p.score.f.v,"var(--func)")}
        ${axis("EFFICIENCY",p.score.e.v,"var(--eff)")}
      </div>
    </div>
    <hr style="border:0;border-top:1px solid var(--stroke);margin:0">
    <div style="display:flex;flex-direction:column;gap:12px">
      ${rat("var(--clarity)","CLARITY",p.score.c.r)}
      ${rat("var(--func)","FUNCTIONALITY",p.score.f.r)}
      ${rat("var(--eff)","EFFICIENCY",p.score.e.r)}
    </div>
  </div>`:""}

  <div class="card" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--t3)">THE PROMPT</span>
      <button class="copybtn" id="copybtn" onclick="copyPrompt('${p.id}')">${IC.copy}Copy</button>
    </div>
    <pre class="promptbody">${esc(p.text)}</pre>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin-top:14px">
    ${p.models.map(m=>`<span class="modelchip">${m}</span>`).join("")}
    <span style="flex:1"></span>
    <span style="font-size:12px;font-weight:700;color:var(--t3)">~${tokensOf(p.text)} tokens</span>
  </div>

  <div class="actionbar">
    <button class="actionbtn" style="color:${liked?"var(--ember)":"var(--t2)"}" onclick="toggleLike('${p.id}')">${IC.heart(liked)}${p.likes}</button>
    <button class="actionbtn" style="color:${used?"var(--eff)":"var(--t2)"}" onclick="markUsed('${p.id}')">${IC.bolt}${used?"Used ✓":"I used this"}</button>
    <button class="actionbtn" style="color:var(--clarity)" onclick="openFork('${p.id}')">${IC.fork}Fork</button>
    <button class="actionbtn" style="color:${saved?"var(--flame)":"var(--t2)"}" onclick="toggleSave('${p.id}')">${IC.mark(saved)}Save</button>
  </div>`;
}

// ---------- actions ----------
function toggleLike(id){
  const p = promptOf(id); if(!p) return;
  if(store.liked.has(id)){ store.liked.delete(id); p.likes--; }
  else { store.liked.add(id); p.likes++; }
  persist(); render(true);
}
function markUsed(id){
  const p = promptOf(id); if(!p || store.used.has(id)) return;
  store.used.add(id); p.used++; persist(); render(true);
  toast("Logged — that's what trending is built on ⚡");
}
function toggleSave(id){
  const p = promptOf(id); if(!p) return;
  const was = store.saved.has(id);
  if(was) store.saved.delete(id); else store.saved.add(id);
  persist(); render(true);
  toast(was ? "Removed from Saved" : "Saved to your library 🔖");
}
async function copyToClipboard(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove(); return ok;
  }
}
async function copyPrompt(id){
  const p = promptOf(id); if(!p) return;
  const ok = await copyToClipboard(p.text);
  const btn = $("#copybtn");
  if(btn && ok){ btn.classList.add("ok"); btn.innerHTML = IC.check+"Copied"; setTimeout(()=>{ if($("#copybtn")){ $("#copybtn").classList.remove("ok"); $("#copybtn").innerHTML=IC.copy+"Copy"; } },1600); }
  toast(ok?"Prompt copied — go use it":"Copy failed — select the text manually");
}
let toastTimer=null;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

// ---------- submit flow ----------
function openSubmit(mode, forkOfId){
  const seed = {cat:null, sub:null, challenge:false, forkOf:null};
  if(mode==="challenge"){ seed.cat=CHALLENGE.cat; seed.challenge=true; }
  if(forkOfId){ seed.forkOf=forkOfId; }
  const orig = seed.forkOf ? promptOf(seed.forkOf) : null;
  ui.sub = {
    step:"compose", seed,
    title: orig?orig.title:"", text: orig?orig.text:"",
    cat: orig?orig.cat : (seed.cat||"work"),
    subcat: orig?orig.sub : (seed.cat?CATS[seed.cat].subs[0]:""),
    conf:0, outcome:null,
  };
  renderSubmit();
}
function openFork(id){ openSubmit(null,id); }
function closeSubmit(){
  ui.sub=null;
  const ov=$("#submit-ov"); if(ov) ov.remove();
  render();
}

function renderSubmit(){
  let ov = $("#submit-ov");
  if(!ov){ ov=document.createElement("div"); ov.id="submit-ov"; ov.className="overlay"; document.body.appendChild(ov); }
  const s = ui.sub;
  const title = s.step==="compose" ? (s.seed.forkOf?"Fork Prompt":"Log a Prompt") : s.step==="categorize" ? "Categorize" : "";
  const canContinue = s.title.trim().length>0 && s.text.trim().length>=12;

  let body="";
  if(s.step==="compose"){
    const orig = s.seed.forkOf?promptOf(s.seed.forkOf):null;
    body = `
    <div style="display:flex;flex-direction:column;gap:14px;flex:1;padding-bottom:24px">
      ${s.seed.challenge?`<div class="notice" style="background:rgba(252,82,0,.12);color:var(--flame)">⚡ Weekly Challenge entry — ${esc(CHALLENGE.theme)}</div>`:""}
      ${orig?`<div class="notice" style="background:rgba(56,189,248,.1);color:var(--clarity)">${IC.fork}<span>Forking “${esc(orig.title)}” — credit stays with the original.</span></div>`:""}
      <input class="field" placeholder="Give it a name" value="${esc(s.title)}" maxlength="80"
        oninput="ui.sub.title=this.value;subSync()">
      <textarea class="field" placeholder="Paste or write the prompt you actually use…" spellcheck="false"
        oninput="ui.sub.text=this.value;subSync()">${esc(s.text)}</textarea>
      <div class="subfoot">
        <span id="tokcount"># ~${tokensOf(s.text)} tokens</span>
        <span style="color:var(--t3)">Judge: on-device</span>
      </div>
      <button class="btn-primary" id="subcontinue" ${canContinue?"":"disabled"} onclick="subContinue()">Continue</button>
    </div>`;
  }
  else if(s.step==="categorize"){
    body = `
    <div style="display:flex;flex-direction:column;gap:18px;padding-bottom:24px">
      ${s.conf>0.4 && !s.seed.forkOf && !s.seed.cat ? `<div style="display:flex;align-items:center;gap:8px;color:var(--flame);font-size:12px;font-weight:900">${IC.wand}Auto-detected · ${Math.round(s.conf*100)}% confident</div>`:""}
      <h2 style="margin:0;font-size:20px;font-weight:900">Category</h2>
      <div class="catpick">
        ${CAT_KEYS.map(k=>{
          const c=CATS[k], on=s.cat===k;
          return `<button class="catbtn" style="${on?`color:${c.color};border-color:${c.color};background:${c.color}26`:""}" onclick="subPick('${k}')">${c.em} ${c.name}</button>`;
        }).join("")}
      </div>
      <h2 style="margin:0;font-size:20px;font-weight:900">Subcategory</h2>
      <div class="subchips">
        ${CATS[s.cat].subs.map(sb=>{
          const c=CATS[s.cat], on=s.subcat===sb;
          return `<button class="subchip" style="${on?`color:${c.color};border-color:${c.color};background:${c.color}26`:""}" onclick="subPickSub('${esc(sb)}')">${esc(sb)}</button>`;
        }).join("")}
      </div>
      <button class="btn-primary" style="margin-top:8px" onclick="subScore()">Score it</button>
    </div>`;
  }
  else if(s.step==="judging"){
    body = `
    <div class="judging">
      <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="55" stroke="var(--flame)" opacity=".2" stroke-width="10" fill="none"/>
        <circle class="spin" cx="60" cy="60" r="55" stroke="var(--flame)" stroke-width="10" fill="none"
          stroke-linecap="round" stroke-dasharray="96 250"/>
        <text x="60" y="72" text-anchor="middle" font-size="34">⚖️</text>
      </svg>
      <h2>Judging your prompt…</h2>
      <p>Clarity · Functionality · Efficiency</p>
    </div>`;
  }
  else if(s.step==="reveal" && s.outcome){
    const o = s.outcome, p = o.prompt, score = p.score, comp = composite(score);
    const pills = []
      .concat(o.isPersonalBest?[["🏆","Personal best","var(--eff)"]]:[])
      .concat(o.didLevelUp?[["⬆️","Level "+levelOf(store.me.xp)+"!","var(--flame)"]]:[])
      .concat(o.newBadges.map(b=>[b.em, b.name+" unlocked", b.color]));
    body = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:12px 0 28px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <span class="tier" style="color:${compColor(comp)}">${tierName(comp)}</span>
        ${ringHTML(comp,{size:150,lw:13,color:compColor(comp),animate:true})}
        <div style="font-size:18px;font-weight:800;text-align:center;max-width:30ch">${esc(p.title)}</div>
        ${catChip(p.cat,p.sub)}
      </div>
      ${pills.length?`<div class="achieve">${pills.map(([em,l,c],i)=>`<span class="apill" style="color:${c};border-color:${c}66;background:${c.startsWith("var")?"rgba(255,255,255,.05)":c+"22"};animation-delay:${1.2+i*0.15}s">${em} ${esc(l)}</span>`).join("")}</div>`:""}
      <div style="display:flex;gap:18px">
        ${ringHTML(score.c.v,{size:82,lw:8,color:"var(--clarity)",label:"Clarity",animate:true,delay:0.5})}
        ${ringHTML(score.f.v,{size:82,lw:8,color:"var(--func)",label:"Function",animate:true,delay:0.75})}
        ${ringHTML(score.e.v,{size:82,lw:8,color:"var(--eff)",label:"Efficiency",animate:true,delay:1.0})}
      </div>
      <div class="card" style="width:100%;display:flex;flex-direction:column;gap:12px">
        <div class="rationale"><span class="dot" style="background:var(--clarity)"></span><div><div class="rt" style="color:var(--clarity)">CLARITY</div><p>${esc(score.c.r)}</p></div></div>
        <div class="rationale"><span class="dot" style="background:var(--func)"></span><div><div class="rt" style="color:var(--func)">FUNCTIONALITY</div><p>${esc(score.f.r)}</p></div></div>
        <div class="rationale"><span class="dot" style="background:var(--eff)"></span><div><div class="rt" style="color:var(--eff)">EFFICIENCY</div><p>${esc(score.e.r)}</p></div></div>
      </div>
      <div class="xpline">
        <span class="xp">✨ +${comp} XP · streak day ${store.me.streak}</span>
        ${o.weeklyRank?`<span class="rank">#${o.weeklyRank} in ${CATS[p.cat].name} this week</span>`:""}
      </div>
      <div style="display:flex;gap:10px;width:100%">
        <button class="btn-secondary" onclick="subShare()">${IC.share}Share</button>
        <button class="btn-primary" onclick="closeSubmit()">Done</button>
      </div>
    </div>`;
  }

  ov.innerHTML = `<div class="inner">
    <div class="ovnav">
      ${s.step!=="judging"&&s.step!=="reveal"?`<button onclick="closeSubmit()">Cancel</button>`:"<span></span>"}
      <h2>${title}</h2><span></span>
    </div>
    ${body}
  </div>`;
  activateRings(ov);
}
function subSync(){
  const s=ui.sub;
  const tok=$("#tokcount"); if(tok) tok.textContent = "# ~"+tokensOf(s.text)+" tokens";
  const btn=$("#subcontinue"); if(btn) btn.disabled = !(s.title.trim().length>0 && s.text.trim().length>=12);
}
function subContinue(){
  const s=ui.sub;
  const det = detectCategory(s.text);
  if(!s.seed.forkOf && !s.seed.cat){ s.cat=det.cat; s.subcat=det.sub; }
  if(!s.subcat) s.subcat=CATS[s.cat].subs[0];
  s.conf=det.conf; s.step="categorize"; renderSubmit();
}
function subPick(cat){ ui.sub.cat=cat; ui.sub.subcat=CATS[cat].subs[0]; renderSubmit(); }
function subPickSub(sb){ ui.sub.subcat=sb; renderSubmit(); }
async function subScore(){
  const s=ui.sub; s.step="judging"; renderSubmit();
  s.outcome = await doSubmit(s.title.trim(), s.text.trim(), s.cat, s.subcat, s.seed.forkOf);
  if(ui.sub!==s) return; // cancelled meanwhile
  s.step="reveal"; renderSubmit();
}
async function subShare(){
  const o=ui.sub && ui.sub.outcome; if(!o) return;
  const sc=o.prompt.score, comp=composite(sc);
  const text = `My prompt “${o.prompt.title}” scored ${comp}/100 (${tierName(comp)}) on PromptStrava 🔥 Clarity ${sc.c.v} · Function ${sc.f.v} · Efficiency ${sc.e.v}`;
  if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){} }
  const ok = await copyToClipboard(text);
  toast(ok?"Score copied — paste it anywhere":"Couldn't copy — screenshot works too");
}

// ---------- onboarding ----------
function renderOnboarding(){
  let ov=$("#onb-ov");
  if(!ov){ ov=document.createElement("div"); ov.id="onb-ov"; ov.className="overlay"; document.body.appendChild(ov); }
  const p=ui.onbPage;
  const canGo = p<2 || store.interests.size>0;
  const btnLabel = p===0?"How it works":p===1?"Pick your arenas":"Start logging prompts";
  let page="";
  if(p===0) page=`
    <div class="onbpage">
      <span class="flamehero">🔥</span>
      <h1>PromptStrava</h1>
      <p class="lead">The prompts you use every day are a skill.<br>Log them. Score them. Compete.</p>
    </div>`;
  else if(p===1) page=`
    <div class="onbpage">
      <h2>Every prompt gets judged</h2>
      <div style="display:flex;gap:20px">
        ${ringHTML(86,{size:88,lw:8,color:"var(--clarity)",label:"Clarity",animate:true,delay:0.1})}
        ${ringHTML(91,{size:88,lw:8,color:"var(--func)",label:"Function",animate:true,delay:0.35})}
        ${ringHTML(78,{size:88,lw:8,color:"var(--eff)",label:"Efficiency",animate:true,delay:0.6})}
      </div>
      <div class="card" style="text-align:left;display:flex;flex-direction:column;gap:14px;width:100%">
        <div class="rationale"><span class="dot" style="background:var(--clarity)"></span><div><b style="font-size:15px">Clarity</b><p style="margin:2px 0 0;font-size:13px;color:var(--t2)">Zero ambiguity. The model can't misread you.</p></div></div>
        <div class="rationale"><span class="dot" style="background:var(--func)"></span><div><b style="font-size:15px">Functionality</b><p style="margin:2px 0 0;font-size:13px;color:var(--t2)">Reliably produces the output you actually wanted.</p></div></div>
        <div class="rationale"><span class="dot" style="background:var(--eff)"></span><div><b style="font-size:15px">Efficiency</b><p style="margin:2px 0 0;font-size:13px;color:var(--t2)">No wasted tokens. Result in one shot.</p></div></div>
      </div>
      <p class="lead" style="font-size:14px">The judge scores each axis 0–100 and tells you exactly how to improve.</p>
    </div>`;
  else page=`
    <div class="onbpage" style="justify-content:flex-start;padding-top:48px">
      <h2>Where do you prompt?</h2>
      <p class="lead" style="font-size:14px">Pick at least one. This shapes your feed.</p>
      <div class="intgrid">
        ${CAT_KEYS.map(k=>{
          const c=CATS[k], on=store.interests.has(k);
          return `<button class="intbtn" style="${on?`color:${c.color};border-color:${c.color};background:${c.color}26`:""}" onclick="onbToggle('${k}')">
            <span class="em">${c.em}</span>${c.name}</button>`;
        }).join("")}
      </div>
    </div>`;
  ov.innerHTML = `<div class="inner"><div class="onb">
    ${page}
    <div class="dots">${[0,1,2].map(i=>`<span class="${i===p?"on":""}"></span>`).join("")}</div>
    <button class="btn-primary" ${canGo?"":"disabled"} onclick="onbNext()">${btnLabel}</button>
  </div></div>`;
  activateRings(ov);
}
function closeOnboarding(){ const ov=$("#onb-ov"); if(ov) ov.remove(); }
function onbToggle(k){
  if(store.interests.has(k)) store.interests.delete(k); else store.interests.add(k);
  persist(); renderOnboarding();
}
function onbNext(){
  if(ui.onbPage<2){ ui.onbPage++; renderOnboarding(); }
  else { store.onboarded=true; persist(); render(); }
}

// ---------- boot ----------
loadStore();
render();
</script>
